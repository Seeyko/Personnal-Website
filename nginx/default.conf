server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (CSS/JS/JSON/SVG/fonts) — cuts transfer size on the
    # critical path. (No-op if compression is already enabled globally.)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml font/woff2;

    # SEO/crawl files: serve the real file (and a correct type), never the SPA
    # fallback. Without these, try_files …/index.html returns HTML for /robots.txt
    # (the original 562-error bug) and /sitemap.xml.
    location = /robots.txt  { try_files /robots.txt =404; default_type text/plain; }
    location = /sitemap.xml { try_files /sitemap.xml =404; default_type application/xml; }
    location = /favicon.ico { try_files /favicon.ico =404; }
    location = /site.webmanifest { try_files /site.webmanifest =404; default_type application/manifest+json; }

    # Homepage and other pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blog routes: in production, Traefik routes /blog/* directly to the Go backend (SSR).
    # This fallback serves blog.html for local development without Traefik.
    location /blog {
        try_files $uri $uri/ /blog.html;
    }

    # Admin dashboard (served at exact secret path — injected via envsubst at build time)
    location = /${ADMIN_SECRET_PATH} {
        try_files /admin.html =404;

        # Security headers — no caching, no referrer leaks
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
    }

    # Static assets caching (incl. the new webp/avif/mp4 formats)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
