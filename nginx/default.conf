server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    # Homepage and other pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blog routes -> serve blog.html
    location /blog {
        try_files $uri $uri/ /blog.html;
    }

    # Admin dashboard (served at secret path — configured via ADMIN_SECRET_PATH env var)
    # The admin.html file is served at /{ADMIN_SECRET_PATH} route
    # This location is set up during Docker build via envsubst
    location ~ ^/(_[a-zA-Z0-9]+)$ {
        # Only serve admin.html if the file exists
        try_files /admin.html =404;

        # Security headers — no caching, no referrer leaks
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
