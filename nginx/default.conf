server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    # Homepage and other pages
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blog routes: in production, Traefik routes /blog/* directly to the Go backend (SSR).
    # This fallback serves blog.html for local development without Traefik.
    location /blog {
        try_files $uri $uri/ /blog.html;
    }

    # Admin dashboard (served at exact secret path — injected via envsubst at build time)
    location = /${ADMIN_SECRET_PATH} {
        try_files /admin.html =404;

        # Security headers — no caching, no referrer leaks
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
