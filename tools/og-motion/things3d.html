<!doctype html>
<!--
  og-motion /things — les stickers de /things tombent un par un et s'entassent, puis Blip range le tas
  en une grille propre, comme sur la page. Même pipeline que scene3d.html (Three.js 0.160.0, Blip en
  voxels pixel pour pixel, papier du site et sa grille de points, render(t) fonction pure du temps).

  Les stickers sont les VRAIES images de la page (frontend/assets/things/*.webp, déjà détourées avec
  leur liseré blanc), dans l'ordre de frontend/data/fr/things.json : seulement les objets publiés
  (avec image, pas « plus utilisé »).

  Servi depuis la racine du dépôt :  python3 -m http.server 8766  →  /tools/og-motion/things3d.html
  ?t=12.3 fige un instant · ?play la joue en boucle · ?w=1200&h=630 taille du rendu
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>og-motion things</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #f8f7f4; }
  canvas { display: block; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const DURATION = 18;
const PAL = { paper: '#f8f7f4', ink: '#2c2825', muted: '#7a726a', accent: '#3d7a73', clay: '#b95c3a', ochre: '#a8822a' };

// ── temps ──────────────────────────────────────────────────────────
const step = t => Math.floor(t * 12 + 1e-6) / 12;              // les sprites bougent par pas de 1/12 s (BRANDING.md)
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const out = k => 1 - Math.pow(1 - k, 3);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function track(t, keys, f = ease) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const a = keys[i - 1], b = keys[i], k = f(prog(t, a[0], b[0]));
    return a.slice(1).map((v, j) => lerp(v, b[j + 1], k));
  }
  return keys[keys.length - 1].slice(1);
}
let seed = 7;                                                   // aléa déterministe : la même vidéo à chaque rendu
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

// ── rendu ──────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.paper);
scene.fog = new THREE.Fog(PAL.paper, 30, 70);
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);

// éclairage réglé pour qu'un sticker à plat rende sa couleur exacte (les teintes des photos restent justes)
const hemi = new THREE.HemisphereLight('#ffffff', '#ffffff', 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 1);
sun.position.set(-6, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 16, bottom: -16, near: 1, far: 50 });
sun.shadow.radius = 5;
sun.shadow.bias = -0.0006;
scene.add(sun);
const LIGHT = { hemi: Number(Q.get('hemi') || 1.75), sun: Number(Q.get('sun') || 1.85) };
hemi.intensity = LIGHT.hemi; sun.intensity = LIGHT.sun;

// sol : le papier du site et sa grille de points, non éclairé (cyclorama infini), + un calque d'ombres
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = PAL.paper; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#e4ddd2'; g.beginPath(); g.arc(32, 32, 2.4, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(120, 120);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
})();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ map: dotTex }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const shade = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ color: '#5c5650', opacity: .26 }));
shade.rotation.x = -Math.PI / 2; shade.position.y = .002; shade.receiveShadow = true;
scene.add(shade);

// ── Blip en voxels (repris de scene3d.html) ───────────────────────
const VOX = 0.075;
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
function rasterSvg(svg, w, h) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onerror = () => rej(new Error('svg illisible'));
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, w, h);
      res(g.getImageData(0, 0, w, h));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function voxelSprite(svg, w, h, hot, { depth = 2, faceBox = null, bodyAt = [8, 13] } = {}) {
  const data = await rasterSvg(svg, w, h);
  const cells = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (data.data[i + 3] < 128) continue;
    cells.push({ x, y, c: new THREE.Color(`rgb(${data.data[i]},${data.data[i + 1]},${data.data[i + 2]})`) });
  }
  const mat = new THREE.MeshBasicMaterial();
  mat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vShade;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvec3 nW = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);\nvShade = nW.y > .5 ? 1.06 : (nW.y < -.5 ? .55 : (abs(nW.x) > .5 ? .72 : 1.0));');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vShade;')
      .replace('#include <opaque_fragment>', 'outgoingLight *= vShade;\n#include <opaque_fragment>');
  };
  const mesh = new THREE.InstancedMesh(boxGeo, mat, cells.length * depth);
  const m = new THREE.Matrix4();
  let k = 0;
  cells.forEach(cell => {
    for (let d = 0; d < depth; d++) {
      m.makeScale(VOX, VOX, VOX).setPosition((cell.x - hot[0] + .5) * VOX, -(cell.y - hot[1] + .5) * VOX, -(d + .5) * VOX);
      mesh.setMatrixAt(k, m); mesh.setColorAt(k, cell.c); k++;
    }
  });
  mesh.castShadow = true;
  const group = new THREE.Group();
  group.add(mesh);
  if (faceBox) {
    const body = cells.find(c => c.x === bodyAt[0] && c.y === bodyAt[1])?.c;
    const face = [];
    cells.forEach((c, ci) => {
      if (c.x >= faceBox[0] && c.x <= faceBox[1] && c.y >= faceBox[2] && c.y <= faceBox[3] && body && !c.c.equals(body))
        for (let d = 0; d < depth; d++) face.push([ci * depth + d, c.c]);
    });
    let shut = false;
    group.blink = s => {
      if (s === shut) return; shut = s;
      face.forEach(([idx, col]) => mesh.setColorAt(idx, s ? body : col));
      mesh.instanceColor.needsUpdate = true;
    };
  }
  return group;
}
async function blipVoxels() {
  const svg = await (await fetch('/frontend/assets/brand/blip-default.svg')).text();
  const g = await voxelSprite(svg, 24, 24, [6, 1], { depth: 3, faceBox: [8, 15, 11, 16] });
  // pivot au centre des pieds (colonne 12, ligne 23) : il tourne et se tasse sur place
  g.children[0].position.set(-6 * VOX, 22 * VOX, 1.5 * VOX);
  return g;
}
const blinkAt = (t, phase = 0) => ((t + phase) % 1.06) < 1 / 12;

// ── la page : titre et grille ──────────────────────────────────────
const SW = 2.2, SH = 1.65;                                      // un sticker = l'image 4:3 de la page
const COLS = 13, ROWS = 6, GX = 1.6, GZ = 1.3;               // 77 objets + la case de Blip = 78
const GRID_Z = -2.2;                                           // centre de la grille
const slot = j => V((j % COLS - (COLS - 1) / 2) * GX, 0, GRID_Z + (Math.floor(j / COLS) - (ROWS - 1) / 2) * GZ);
const PILE = V(0, 0, 6.4);                                     // le tas, devant la grille

function floorText(lines, wU, hU) {                            // un calque posé sur le papier (pas éclairé : encre exacte)
  const s = 160, c = document.createElement('canvas'); c.width = Math.round(wU * s); c.height = Math.round(hU * s);
  const g = c.getContext('2d');
  lines.forEach(L => {
    g.font = L.font.replace(/(\d+(\.\d+)?)u/, (_, n) => `${n * s}px`);
    g.fillStyle = L.color; g.textBaseline = 'alphabetic';
    if (L.letterSpacing) g.letterSpacing = `${L.letterSpacing * s}px`;
    g.fillText(L.text, L.x * s, L.y * s);
    if (L.after) L.after(g, s, g.measureText(L.text).width);
  });
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wU, hU), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  return m;
}

// ── les stickers ───────────────────────────────────────────────────
const stickers = [];
let blip, HEAD;
async function build() {
  for (const [file, weight] of [['rP2Hp2ywxg089UriCZOIHQ', '400'], ['rP2Hp2ywxg089UriCZOIHQ', '700']])
    document.fonts.add(await new FontFace('DM Sans', `url(/frontend/assets/fonts/${file}.woff2)`, { weight: '100 1000' }).load());
  document.fonts.add(await new FontFace('JetBrains Mono', 'url(/frontend/assets/fonts/tDbV2o-flEEny0FZhsfKu5WU4xD7OwE.woff2)', { weight: '400' }).load());

  const data = await (await fetch('/frontend/data/fr/things.json')).json();
  const items = data.items.filter(i => i.image && !i.retired);
  window.COUNT = items.length;
  const loader = new THREE.TextureLoader();
  const geo = new THREE.PlaneGeometry(SW, SH);
  geo.rotateX(-Math.PI / 2);                                   // à plat : face vers le ciel
  await Promise.all(items.map(async (it, j) => {
    const tex = await loader.loadAsync('/frontend' + it.image);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
    const mat = new THREE.MeshLambertMaterial({ map: tex, alphaTest: .5, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: .5 });
    scene.add(mesh);
    stickers[j] = { id: it.id, mesh, slot: slot(j), yaw: (rnd() - .5) * .09 };
  }));

  // ordre de chute : quelques objets forts d'abord, lentement, puis le reste en averse
  const hero = ['meuble-skate', 'yamaha-clp-320', 'sony-a6000'];
  const rest = stickers.filter(s => !hero.includes(s.id));
  for (let i = rest.length - 1; i > 0; i--) { const k = Math.floor(rnd() * (i + 1)); [rest[i], rest[k]] = [rest[k], rest[i]]; }
  const order = [...hero.map(h => stickers.find(s => s.id === h)).filter(Boolean), ...rest];
  const N = order.length, landed = [];
  order.forEach((s, k) => {
    s.drop = 1.0 + 6.4 * Math.sqrt(k / (N - 1));               // de plus en plus vite
    // le tas : un monticule, chaque sticker se pose sur ceux déjà tombés à côté
    const a = rnd() * Math.PI * 2, r = 2.7 * Math.sqrt(rnd()) * (k < 3 ? .35 : 1);
    const x = PILE.x + Math.cos(a) * r * 1.25, z = PILE.z + Math.sin(a) * r * .8;
    const under = landed.filter(p => Math.abs(p.x - x) < SW * .8 && Math.abs(p.z - z) < SH * .8).length;
    const y = .012 + under * .045;
    // il penche vers l'extérieur du monticule
    const tilt = Math.min(.28, under * .03);
    s.land = { x, y, z, rx: Math.sin(a) * tilt + (rnd() - .5) * .12, rz: -Math.cos(a) * tilt + (rnd() - .5) * .12, ry: rnd() * Math.PI * 2 };
    s.from = { x: x + (rnd() - .5) * 2.4, z: z - 1 - rnd() * 1.5, ry: s.land.ry + (rnd() - .5) * 5, spin: (rnd() - .5) * 2 };
    landed.push({ x, z, y });
  });
  // le sommet du tas, là où Blip se perche
  PILE_TOP = Math.max(...landed.filter(p => Math.hypot(p.x - PILE.x, p.z - PILE.z) < 1).map(p => p.y)) + .05;
  // le rangement : dans l'ordre de la page (catégorie par catégorie), Blip lance chaque sticker à sa place
  const M = stickers.length;
  stickers.forEach((s, j) => { s.tidy = TIDY0 + 5.2 * Math.pow(j / (M - 1), .78); });
  TIDY_END = Math.max(...stickers.map(s => s.tidy)) + FLY;

  // l'en-tête de la page, posé sur le papier au-dessus de la grille, aligné à gauche
  const left = slot(0).x - SW / 2 + .05, top = slot(0).z - SH / 2 - .25;
  const head = floorText([
    { text: '~/things', font: '400 .56u "JetBrains Mono"', color: PAL.accent, x: .05, y: .62,
      after: (g, s, w) => { g.fillStyle = PAL.accent; g.fillRect((.05 + .1) * s + w, .2 * s, .26 * s, .46 * s);
        g.fillStyle = '#d6cfc4'; g.fillRect((.05 + .6) * s + w, .12 * s, .03 * s, .62 * s);
        g.font = `400 ${.56 * s}px "JetBrains Mono"`; g.fillStyle = PAL.muted; g.fillText(`${M} things`, (.05 + .86) * s + w, .62 * s); } },
    { text: 'Things', font: '700 2.6u "DM Sans"', color: PAL.ink, x: -.05, y: 3.1, letterSpacing: -.1 }
  ], 12, 3.6);
  head.position.set(left + 6, .003, top - 1.8);
  scene.add(head);
  HEAD = head;

  blip = await blipVoxels();
  scene.add(blip);
}
const TIDY0 = 9.9, FLY = .72;
let TIDY_END = 15.8;
const BLIP_IN = 8.1;                                           // Blip tombe à côté du tas
const BLIP_ON = 9.2;                                           // il saute sur le tas
const BLIP_HOME = () => slot(COLS * ROWS - 1);                 // la dernière case, laissée vide : c'est la sienne

// ── caméra ─────────────────────────────────────────────────────────
// [t, px, py, pz, cible x, y, z]
const CAMK = [
  [0.0, 1.6, 3.0, 11.2, 0, .6, 6.4],                          // près du sol : le premier sticker tombe
  [2.4, -.8, 4.6, 12.8, 0, .4, 6.4],
  [5.4, -2.6, 6.2, 13.4, 0, .3, 6.2],                          // l'averse : on recule, le tas grandit
  [8.0, .4, 6.4, 13.6, 1.2, .6, 6.4],                          // Blip tombe à côté
  [9.8, 1.4, 6.6, 13.4, .6, .7, 6.2],                          // Blip sur le tas
  [12.6, 1.0, 16.0, 16.0, 0, 0, 2.6],                          // il lance : on monte pour voir la grille se remplir
  [15.9, 0, 21.6, 11.4, 0, 0, -3.5],
  [18.0, 0, 22.0, 11.0, 0, 0, -3.6]                             // la page rangée, presque à plat
];
function camAt(T) {
  const [px, py, pz, tx, ty, tz] = track(T, CAMK);
  camera.position.set(px, py, pz);
  camera.lookAt(tx, ty, tz);
}

// ── render(t) ──────────────────────────────────────────────────────
let PILE_TOP = .6;
const pileTop = () => PILE_TOP;
function placeSticker(s, t) {
  const m = s.mesh, L = s.land;
  if (t < s.drop - .9) { m.visible = false; return; }
  m.visible = true;
  if (t < s.tidy) {
    // la chute : gravité, il papillonne en tombant, petit rebond à l'arrivée
    const k = prog(t, s.drop - .9, s.drop);
    const f = s.from;
    m.position.set(lerp(f.x, L.x, out(k)), L.y + 7 * (1 - k * k), lerp(f.z, L.z, out(k)));
    const flutter = (1 - k) * .9;
    m.rotation.set(L.rx + Math.sin(k * 9 + f.spin) * flutter, lerp(f.ry, L.ry, out(k)), L.rz + Math.cos(k * 7 + f.spin) * flutter);
    if (k >= 1) {
      const b = prog(t, s.drop, s.drop + .3);
      m.position.y = L.y + Math.sin(Math.PI * b) * .12 * (1 - b);
    }
    return;
  }
  // le lancer de Blip : il part du tas, monte en arc et se pose à plat dans sa case
  const k = prog(t, s.tidy, s.tidy + FLY), e = ease(k);
  const lift = k < .12 ? 0 : 1;
  const to = s.slot;
  m.position.set(lerp(L.x, to.x, e), lerp(L.y, .012, e) + Math.sin(Math.PI * k) * (2.6 + .03 * Math.abs(to.x)) * lift, lerp(L.z, to.z, e));
  // il tourne en vol jusqu'à être droit (le léger biais des stickers de la page)
  const ry = L.ry - Math.round((L.ry - s.yaw) / (Math.PI * 2)) * Math.PI * 2;
  m.rotation.set(lerp(L.rx, 0, e), lerp(ry, s.yaw, e) + Math.sin(Math.PI * k) * .6, lerp(L.rz, 0, e));
  if (k >= 1) {                                                // posé : tac, un petit rebond
    const b = prog(t, s.tidy + FLY, s.tidy + FLY + .25);
    m.position.y = .012 + Math.sin(Math.PI * b) * .08 * (1 - b);
  }
}
let STILL = false;
function render(T) {
  const t = STILL ? DURATION : T;
  camAt(t);
  stickers.forEach(s => placeSticker(s, t));
  // l'en-tête de la page apparaît quand la grille se forme
  HEAD.material.opacity = out(prog(t, 12.4, 13.8));
  HEAD.visible = HEAD.material.opacity > 0;

  // Blip : il tombe à côté du tas, regarde le désordre, saute dessus, lance chaque sticker à sa place,
  // puis va se mettre dans la dernière case vide de la grille. Tout par pas de 1/12 s.
  const ts = step(t);
  blip.visible = ts >= BLIP_IN - .5;
  if (blip.visible) {
    const side = V(PILE.x + 3.7, 0, PILE.z + .6);
    const top = V(PILE.x + .1, pileTop(), PILE.z + .1);
    const home = BLIP_HOME();
    let p, sy = 1, yaw = -.5, sc = 1.35;
    if (ts < BLIP_IN) {                                        // la chute
      const k = Math.floor(prog(ts, BLIP_IN - .5, BLIP_IN) * 6) / 6;
      p = side.clone(); p.y = 6 * (1 - k * k);
    } else if (ts < BLIP_ON) {                                 // il atterrit, s'écrase, regarde le tas, cligne
      p = side.clone();
      const kk = prog(ts, BLIP_IN, BLIP_IN + .5);
      sy = [.62, 1.18, .92, 1.04, 1, 1][Math.min(5, Math.floor(kk * 6))];
      yaw = ts < BLIP_IN + .9 ? .3 : ts < BLIP_IN + 1.15 ? -1.0 : -.65;   // il regarde la caméra, puis le tas
      if (ts > BLIP_ON - .25) sy = .78;                                    // il prend son élan
    } else if (ts < TIDY0) {                                   // le saut sur le tas
      const k = Math.floor(prog(ts, BLIP_ON, BLIP_ON + .5) * 6) / 6;
      p = side.clone().lerp(top, k); p.y = lerp(0, top.y, k) + Math.sin(Math.PI * k) * 1.6;
      if (k >= 1) { const kk = prog(ts, BLIP_ON + .5, BLIP_ON + .8); sy = [.75, 1.1, 1][Math.min(2, Math.floor(kk * 3))]; }
    } else if (ts < TIDY_END - FLY + .1) {                     // il lance : un coup de reins à chaque sticker, il vise sa case
      p = top.clone();
      const cur = stickers.reduce((a, s) => (s.tidy <= ts ? s : a), stickers[0]);
      const since = ts - cur.tidy;
      sy = since < 1 / 12 ? .8 : since < 2 / 12 ? 1.1 : 1;
      p.y = top.y - (1 - Math.min(1, (ts - TIDY0) / 5)) * 0 - prog(ts, TIDY0, TIDY_END - FLY) * (top.y - .02);   // le tas fond sous ses pieds
      const nxt = stickers.find(s => s.tidy > ts) || cur;
      yaw = Math.round(Math.atan2(nxt.slot.x - p.x, nxt.slot.z - p.z) * 4) / 4;
    } else {                                                   // la dernière case : trois bonds, et il se pose
      const a = TIDY_END - FLY + .1, k = Math.floor(prog(ts, a, a + 1.4) * 12) / 12;
      const hop = Math.floor(k * 3), kh = k * 3 - hop;
      const from = V(PILE.x, .02, PILE.z);
      const P0 = from.clone().lerp(home, hop / 3), P1 = from.clone().lerp(home, Math.min(1, (hop + 1) / 3));
      p = k >= 1 ? home.clone() : P0.lerp(P1, kh);
      p.y = k >= 1 ? 0 : Math.sin(Math.PI * kh) * 1.3;
      yaw = k >= 1 ? 0 : Math.atan2(home.x - from.x, home.z - from.z);
      if (k >= 1) { const kk = prog(ts, a + 1.4, a + 1.8); sy = [.7, 1.12, .96, 1][Math.min(3, Math.floor(kk * 4))]; }
      if (STILL) { sy = 1; yaw = 0; }
    }
    blip.position.copy(p);
    blip.scale.set(sc, sc * sy, sc);
    // posé dans sa case, il se penche vers la caméra (vue presque d'en haut, sinon on ne voit que sa tranche)
    const lean = STILL ? 1 : prog(ts, TIDY_END - FLY + 1.5, TIDY_END - FLY + 2.1);
    blip.rotation.set(-.62 * Math.floor(lean * 4) / 4, yaw, 0);
    blip.blink(!STILL && blinkAt(ts, .3));
  }
  renderer.render(scene, camera);
}

// ── montage ────────────────────────────────────────────────────────
window.ready = (async () => {
  await build();
  window.DURATION = DURATION;
  window.render = render;
  window.setStill = v => { STILL = v; };
  if (Q.has('play')) {                                         // aperçu en boucle dans un navigateur
    const start = performance.now();
    const loop = () => { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  } else render(Q.has('t') ? +Q.get('t') : DURATION);
})();
</script>
</body>
</html>
