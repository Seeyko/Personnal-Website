<!doctype html>
<!--
  og-motion 3D — Blip et son essaim construisent les projets, en motion design Three.js.

  Rien n'est redessiné à la main : les cartes sont les VRAIES cartes du site (capture.mjs les
  photographie dans le thème voulu, avec la géométrie de chaque partie : image, titre, texte,
  tags, badge), Blip et les curseurs sont les vrais sprites (blip-*.svg, CursorSprites)
  extrudés en voxels, pixel pour pixel. Même three.js que le site (0.160.0).

  render(t) est une fonction pure du temps : la scène est recalculée de zéro à chaque image,
  render3d.mjs capture 24 i/s. Les sprites bougent par pas de 1/12 s (BRANDING.md : steps()),
  la caméra glisse.

  Servi depuis la racine du dépôt :  python3 -m http.server 8766  →  /tools/og-motion/scene3d.html
  ?t=12.3 fige un instant · ?w=1200&h=630 taille du rendu · ?theme=default
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>og-motion 3D</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #f8f7f4; }
  canvas { display: block; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<script src="/frontend/js/core/effects/cursor-sprites.js"></script>
<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const THEME = Q.get('theme') || 'default';
const CAP = `/tools/og-motion/captures/${THEME}`;
const DURATION = 21.5;
// palette du thème default (frontend/themes/default/default.css)
const PAL = { paper: '#f8f7f4', card: '#ffffff', tertiary: '#f3f1ed', ink: '#2c2825', accent: '#3d7a73', soft: '#5a9d95', clay: '#b95c3a', ochre: '#a8822a' };

// ── temps ──────────────────────────────────────────────────────────
const step = t => Math.floor(t * 12 + 1e-6) / 12;
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const out = k => 1 - Math.pow(1 - k, 3);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function track(t, keys, f = ease) {                    // [t, ...valeurs] → valeurs interpolées
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const a = keys[i - 1], b = keys[i], k = f(prog(t, a[0], b[0]));
    return a.slice(1).map((v, j) => lerp(v, b[j + 1], k));
  }
  return keys[keys.length - 1].slice(1);
}

// ── rendu ──────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;          // les couleurs de marque restent exactes
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.paper);
scene.fog = new THREE.Fog(PAL.paper, 22, 60);
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);

scene.add(new THREE.HemisphereLight('#ffffff', '#e9e3d8', 2.1));
const sun = new THREE.DirectionalLight('#fff6e8', 1.5);
sun.position.set(-6, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 12, bottom: -6, near: 1, far: 40 });
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun);

// sol papier + grille de points du site (le motif radial du fond)
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = PAL.paper; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#e4ddd2'; g.beginPath(); g.arc(32, 32, 2.4, 0, Math.PI * 2); g.fill();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(120, 120);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
})();
// sol = le papier exact du site (non éclairé : il se fond dans le fond, cyclorama infini) + un calque d'ombres
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ map: dotTex }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const shade = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ color: '#5c5650', opacity: .24 }));
shade.rotation.x = -Math.PI / 2; shade.position.y = .002; shade.receiveShadow = true;
scene.add(shade);

// ── voxels : un sprite pixel-art du site → un mesh instancié ──────
const VOX = 0.075;
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
function rasterSvg(svg, w, h) {
  return new Promise(res => {
    const img = new Image();
    img.onerror = () => { throw new Error('svg illisible : ' + svg.slice(0, 80)); };
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(img, 0, 0, w, h);
      res(g.getImageData(0, 0, w, h));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function voxelSprite(svg, w, h, hot, { depth = 2, faceBox = null, bodyAt = [8, 13] } = {}) {
  const data = await rasterSvg(svg, w, h);
  const cells = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (data.data[i + 3] < 128) continue;
    cells.push({ x, y, c: new THREE.Color(`rgb(${data.data[i]},${data.data[i + 1]},${data.data[i + 2]})`) }); // setStyle convertit déjà sRGB → linéaire (ColorManagement)
  }
  // couleurs du sprite à l'identique, faces ombrées par orientation (look voxel, pas de lumière qui ternit la marque)
  const mat = new THREE.MeshBasicMaterial();
  mat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vShade;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvec3 nW = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);\nvShade = nW.y > .5 ? 1.06 : (nW.y < -.5 ? .55 : (abs(nW.x) > .5 ? .72 : 1.0));');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vShade;')
      .replace('#include <opaque_fragment>', 'outgoingLight *= vShade;\n#include <opaque_fragment>');
  };
  const mesh = new THREE.InstancedMesh(boxGeo, mat, cells.length * depth);
  const m = new THREE.Matrix4();
  let k = 0;
  cells.forEach(cell => {
    for (let d = 0; d < depth; d++) {
      m.makeScale(VOX, VOX, VOX).setPosition((cell.x - hot[0] + .5) * VOX, -(cell.y - hot[1] + .5) * VOX, -(d + .5) * VOX);
      mesh.setMatrixAt(k, m);
      mesh.setColorAt(k, cell.c);
      k++;
    }
  });
  mesh.castShadow = true;
  const group = new THREE.Group();
  group.add(mesh);
  // clignement : les pixels du visage prennent la couleur du corps (BRANDING.md : visage éteint = curseur bloc)
  if (faceBox) {
    const body = cells.find(c => c.x === bodyAt[0] && c.y === bodyAt[1])?.c;
    const face = [];
    cells.forEach((c, ci) => {
      if (c.x >= faceBox[0] && c.x <= faceBox[1] && c.y >= faceBox[2] && c.y <= faceBox[3] && body && !c.c.equals(body))
        for (let d = 0; d < depth; d++) face.push([ci * depth + d, c.c]);
    });
    let shut = false;
    group.blink = s => {
      if (s === shut) return; shut = s;
      face.forEach(([idx, col]) => mesh.setColorAt(idx, s ? body : col));
      mesh.instanceColor.needsUpdate = true;
    };
  }
  return group;
}
const SVG = {};
async function blipVoxels(name, scale = 1) {
  SVG[name] ??= await (await fetch(`/frontend/assets/brand/${name}.svg`)).text();
  const g = await voxelSprite(SVG[name], 24, 24, [6, 1], { depth: 3, faceBox: [8, 15, 11, 16] });
  g.scale.setScalar(scale);
  return g;
}
// Cathode, la compagne CRT (BRANDING.md) : un moniteur, donc profond ; elle cligne de ses yeux-pixels
async function cathodeVoxels(scale = 1) {
  const svg = await (await fetch('/frontend/assets/brand/cathode-default.svg')).text();
  const g = await voxelSprite(svg, 24, 24, [11, 22], { depth: 6, faceBox: [7, 14, 10, 14], bodyAt: [9, 12] });
  g.children[0].position.z = 3 * VOX;                    // centrée sur sa profondeur
  g.scale.setScalar(scale);
  return g;
}
async function cursorVoxels(id, fill, ink = '#111', scale = 1) {
  const s = CursorSprites.get(id);
  const svg = s.markup.replaceAll('currentColor', fill).replace(/var\(--cs-ink,[^)]*\)/g, ink).replace(/var\(--cs-paper,[^)]*\)/g, '#fff').replace(/var\(--cs-accent,[^)]*\)/g, PAL.accent);
  const g = await voxelSprite(svg, s.w, s.h, [s.hotX, s.hotY], { depth: 2 });
  g.scale.setScalar(scale);
  return g;
}

// ── les cartes : vraies captures, révélées partie par partie ──────
const PX = 0.01;                                         // 1 px CSS de carte = 0,01 unité
const cardVert = `varying vec2 vUv; varying float vDist;
void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.); vDist = -mv.z; gl_Position = projectionMatrix * mv; }`;
const cardFrag = `
uniform sampler2D map; uniform vec2 size;            // taille de la carte en px
uniform vec2 click; uniform float fill;              // pot de peinture : cercle depuis le clic (px), rayon 0..1
uniform vec4 media; uniform float paint;             // zone image (x,y,w,h px), part peinte
uniform vec4 lines[5];                               // zones de texte (titre, paragraphe, tags)
uniform vec3 rev;                                    // front du texte tapé : x, haut, bas de la ligne en cours (px)
uniform vec4 badge; uniform float badgeOn;
uniform vec3 tertiary; uniform vec3 white;
varying vec2 vUv; varying float vDist;
uniform vec3 paper;
bool inside(vec2 p, vec4 r){ return p.x>=r.x && p.y>=r.y && p.x<=r.x+r.z && p.y<=r.y+r.w; }
void main(){
  vec2 p = vec2(vUv.x, 1.-vUv.y) * size;
  float r = fill * length(size) * 1.05;
  if (distance(p, click) > r) discard;
  vec4 c = texture2D(map, vUv);
  if (inside(p, media)) {
    // le pinceau : bord en dents de scie (coups de brosse), pas une coupe nette
    float edge = media.x + paint * (media.z + 40.) - 20. + 14. * sin(p.y * .09);
    if (p.x > edge) c.rgb = tertiary;
  }
  // le texte apparaît mot par mot derrière le curseur, comme le clip polygonal de typeWords()
  // (blip-draw.js) : les lignes au-dessus sont écrites, la ligne en cours jusqu'au dernier mot résolu
  bool written = p.y < rev.y || (p.y <= rev.z && p.x <= rev.x);
  for (int i = 0; i < 5; i++) if (lines[i].z > 0. && inside(p, lines[i]) && !written) c.rgb = white;
  if (badge.z > 0. && badgeOn < .5 && inside(p, badge)) c.rgb = white;
  // perspective aérienne : une carte au loin se fond un peu dans le papier (on lit la profondeur)
  c.rgb = mix(c.rgb, paper, smoothstep(6., 24., vDist) * .38);
  gl_FragColor = c;
  #include <colorspace_fragment>
}`;
const cards = [];
async function buildCards(meta) {
  const loader = new THREE.TextureLoader();
  for (const m of meta.cards) {
    const tex = await loader.loadAsync(`${CAP}/card${m.i}.png`);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const w = m.w, h = m.h;
    const lines = m.lines.filter(l => l.tag !== 'span').map(l => l.rect).slice(0, 5);
    while (lines.length < 5) lines.push([0, 0, 0, 0]);
    const uni = {
      map: { value: tex }, size: { value: new THREE.Vector2(w, h) }, click: { value: new THREE.Vector2(w * .7, h * .62) }, fill: { value: 0 },
      media: { value: new THREE.Vector4(...m.media) }, paint: { value: 0 },
      lines: { value: lines.map(r => new THREE.Vector4(r[0] - 2, r[1] - 2, r[2] + 6, r[3] + 6)) }, rev: { value: new THREE.Vector3(-1e4, -1e4, -1e4) },
      badge: { value: new THREE.Vector4(...(m.badge || [0, 0, 0, 0])) }, badgeOn: { value: 0 },
      tertiary: { value: new THREE.Color(PAL.tertiary) }, paper: { value: new THREE.Color(PAL.paper) }, white: { value: new THREE.Color('#ffffff') }
    };
    const face = new THREE.Mesh(new THREE.PlaneGeometry(w * PX, h * PX), new THREE.ShaderMaterial({ uniforms: uni, vertexShader: cardVert, fragmentShader: cardFrag, transparent: false }));
    const g = new THREE.Group();
    g.add(face);
    // l'épaisseur de la carte et son ombre portée : une plaque blanche juste derrière, qui grandit avec le remplissage
    // une vraie épaisseur (14 px) aux tranches ombrées par orientation, comme les voxels : la carte est un objet
    const edge = col => new THREE.MeshBasicMaterial({ color: col });
    const slab = new THREE.Mesh(new THREE.BoxGeometry(w * PX, h * PX, .14),
      [edge('#d2cbbf'), edge('#d2cbbf'), edge('#ebe6dd'), edge('#b9b0a2'), edge('#ffffff'), edge('#e9e4db')]);
    slab.position.z = -.071; slab.castShadow = true;
    g.add(slab);
    // le trait du crayon : contour qui se trace
    const pts = [[0, 0], [w, 0], [w, h], [0, h], [0, 0]].map(([x, y]) => V(x * PX - w * PX / 2, h * PX / 2 - y * PX, .004));
    const outline = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0), 400, .012, 6, false),
      new THREE.MeshBasicMaterial({ color: PAL.ink }));
    g.add(outline);
    // badge tamponné : sa propre plaque, qui saute en avant
    let badgeMesh = null;
    if (m.badge) {
      const bt = await loader.loadAsync(`${CAP}/card${m.i}-badge.png`); bt.colorSpace = THREE.SRGBColorSpace;
      badgeMesh = new THREE.Mesh(new THREE.PlaneGeometry(m.badge[2] * PX, m.badge[3] * PX), new THREE.MeshBasicMaterial({ map: bt, transparent: true }));
      badgeMesh.position.set((m.badge[0] + m.badge[2] / 2) * PX - w * PX / 2, h * PX / 2 - (m.badge[1] + m.badge[3] / 2) * PX, .01);
      g.add(badgeMesh);
    }
    // la traînée de données (data-trail.js) : un canevas transparent juste devant la carte
    const gc = document.createElement('canvas'); gc.width = Math.ceil(w * 2); gc.height = Math.ceil(h * 2);
    const gtex = new THREE.CanvasTexture(gc); gtex.colorSpace = THREE.SRGBColorSpace; gtex.anisotropy = 8;
    const glyphs = new THREE.Mesh(new THREE.PlaneGeometry(w * PX, h * PX), new THREE.MeshBasicMaterial({ map: gtex, transparent: true, depthWrite: false }));
    glyphs.position.z = .006; glyphs.renderOrder = 2;
    g.add(glyphs);
    scene.add(g);
    const textLines = m.lines.filter(l => l.tag !== 'span');
    const words = textLines.flatMap((l, part) => l.words.map(([l0, t0, r0, b0]) => ({ left: l0, top: t0, right: r0, bottom: b0, part })));
    cards.push({ m, g, face, slab, outline, uni, badgeMesh, w, h, lines: textLines, words, glyphs, gc, gctx: gc.getContext('2d'), gtex });
  }
}
// ── la frappe : typeWords() de blip-draw.js, rejouée en fonction pure du temps ──
// chaque mot : le curseur file du mot précédent au bout de celui-ci (outExpo), laisse derrière lui
// des glyphes de données (0 1 { } < > #…, data-trail.js), et 160 ms après son passage le mot
// se résout en lettres ; ses glyphes s'effacent en 140 ms.
const GLYPHS = '01{}<>/\\[]#$%&*+=?:;01AFX10';
const RESOLVE = .16, FADE = .14;
const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
function typing(c, t, a, b) {
  const ws = c.words, n = ws.length;
  const per = (b - a - RESOLVE) / n;
  const ms = t - a;
  if (ms < 0) return { tip: null, rev: [-1e4, -1e4, -1e4], cells: [] };
  if (t >= b) { const l = ws[n - 1]; return { tip: [l.right + 3, (l.top + l.bottom) / 2], rev: [1e4, 1e4, 1e4], cells: [] }; }
  const i = Math.min(n - 1, Math.floor(ms / per));
  const k = clamp((ms - i * per) / per);
  const from = j => { const w = ws[j], pv = j ? ws[j - 1] : null; return pv && Math.abs(pv.top - w.top) < 4 ? pv.right + 3 : w.left - 2; };
  const w = ws[i];
  const tip = [lerp(from(i), w.right + 3, outExpo(k)), (w.top + w.bottom) / 2];
  const done = Math.floor((ms - RESOLVE) / per + 1e-6) - 1;      // dernier mot résolu
  const d = done >= 0 ? ws[Math.min(done, n - 1)] : null;
  const rev = d ? [d.right + 2, Math.max(0, d.top - 2), d.bottom + 4] : [-1e4, -1e4, -1e4];
  const cells = [];
  for (let j = Math.max(0, i - 3); j <= i; j++) {
    const wj = ws[j], h = Math.max(8, wj.bottom - wj.top), fs = Math.min(30, Math.max(9, h * .5)), cw = fs * .62;
    const x0 = from(j), x1 = j < i ? wj.right + 3 : tip[0];
    const gone = (j + 1) * per + RESOLVE;                          // ses lettres sont là : il se dissout
    const alpha = ms < gone ? .75 : .75 * (1 - (ms - gone) / FADE);
    if (alpha <= 0) continue;
    for (let x = x0, q = 0; x + cw <= x1 + .5; x += cw, q++)
      cells.push({ x, y: wj.top + (h - fs) / 2, fs, a: alpha, g: GLYPHS[Math.floor(hash(j * 31 + q, Math.floor(t * 14)) * GLYPHS.length)] });
  }
  return { tip, rev, cells };
}
function drawGlyphs(c, cells) {
  const g = c.gctx;
  if (!cells.length && !c.gdirty) { c.glyphs.visible = false; return; }
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.clearRect(0, 0, c.w, c.h);
  g.fillStyle = PAL.accent; g.textBaseline = 'top';
  for (const k of cells) { g.globalAlpha = k.a; g.font = `400 ${k.fs.toFixed(1)}px "JetBrains Mono", monospace`; g.fillText(k.g, k.x, k.y); }
  g.globalAlpha = 1;
  c.gdirty = cells.length > 0;
  c.glyphs.visible = true;
  c.gtex.needsUpdate = true;
}

// disposition : un arc doux face à la caméra finale
const LAYOUT = [[-8.1, 3.15, -1.5, .38], [-2.65, 3.15, .7, .10], [2.65, 3.15, .7, -.10], [8.1, 3.15, -1.5, -.38]];
// carte → point local (px) en monde
function cardPoint(c, px, py, z = 0) {
  return c.g.localToWorld(V(px * PX - c.w * PX / 2, c.h * PX / 2 - py * PX, z));
}
function outlinePoint(c, k) {                            // tête du crayon sur le contour, k ∈ [0,1]
  const P = 2 * (c.w + c.h); let d = k * P;
  if (d <= c.w) return [d, 0]; d -= c.w;
  if (d <= c.h) return [c.w, d]; d -= c.h;
  if (d <= c.w) return [c.w - d, c.h]; d -= c.w;
  return [0, c.h - d];
}

// un outil à la fois, dans l'ordre : crayon (contour) → pot (remplissage) → pinceau (image) → main (badge) → I-beam (texte)
const PH_LONG = { frame: [0, .16], fill: [.16, .25], paint: [.25, .45], badge: [.45, .5], text: [.5, 1] };
const PH_SHORT = { frame: [0, .13], fill: [.13, .21], paint: [.21, .38], badge: [.38, .46], text: [.46, 1] };
// [début, durée, équipe, phases]
const BUILD = [[4.2, 4.8, 'A', PH_LONG], [9.4, 4.0, 'A', PH_SHORT], [13.6, 4.0, 'A', PH_SHORT], [13.6, 4.0, 'B', PH_SHORT]];
function cardState(c, i, t, still) {
  const [s, D, , PH] = BUILD[i];
  const at = ph => [s + PH[ph][0] * D, s + PH[ph][1] * D];
  const f = ph => still ? 1 : prog(t, ...at(ph));
  const kFrame = ease(f('frame'));
  // tracé du contour par la longueur de la géométrie (drawRange sur l'index du tube)
  const idx = c.outline.geometry.index.count;
  c.outline.geometry.setDrawRange(0, Math.floor(idx * kFrame / 6) * 6);
  c.outline.visible = kFrame > 0 && f('fill') < 1;
  const kFill = f('fill');
  c.uni.fill.value = kFill;
  c.face.visible = kFill > 0;
  c.slab.visible = kFill >= 1;
  const kp = f('paint');
  c.uni.paint.value = Math.floor(kp * 10) / 10;                  // le pinceau avance par coups
  const kb = f('badge');
  c.uni.badgeOn.value = kb >= 1 ? 1 : 0;
  if (c.badgeMesh) {
    c.badgeMesh.visible = kb > 0;
    const sc = kb >= 1 ? 1 : [.3, 1.5, 1.25, 1.05][Math.min(3, Math.floor(kb * 4))];
    c.badgeMesh.scale.setScalar(sc);
    c.badgeMesh.position.z = .01 + (kb < 1 ? .25 * (1 - kb) : 0);
  }
  const ty = still ? typing(c, 1e9, 0, 1) : typing(c, t, ...at('text'));
  c.uni.rev.value.set(...ty.rev);
  drawGlyphs(c, ty.cells);
  // où sont les outils (monde)
  const head = outlinePoint(c, kFrame);
  const zig = Math.floor(kp * 10) % 2 ? .8 : .2;
  const first = c.words[0];
  const tip = ty.tip || [first.left - 2, (first.top + first.bottom) / 2];
  return {
    at,
    pencil: cardPoint(c, head[0], head[1], .02),
    bucket: cardPoint(c, c.w * .7, c.h * .62, .05 + (t >= at('fill')[0] && t < at('fill')[0] + .15 ? -.04 : .1)),
    brush: cardPoint(c, c.m.media[0] + kp * c.m.media[2], c.m.media[1] + zig * c.m.media[3], .03),
    point: c.m.badge ? cardPoint(c, c.m.badge[0] + 30, c.m.badge[1] + 14, kb > 0 && kb < .5 ? .02 : .2) : null,
    ibeam: cardPoint(c, tip[0], tip[1], .03)
  };
}

// ── caméra ─────────────────────────────────────────────────────────
// [t, px, py, pz, cible x, y, z]
let CAMK = [];                                           // [t, px, py, pz, cible x, y, z] — cameraKeys(), une fois les cartes posées
// plan sur une carte : la caméra dans l'axe de la carte, à `dist`, décalée de `side` (m) et `up`
function shot(ci, px, py, dist, side = 0, up = 0) {
  const c = cards[ci], tg = cardPoint(c, px, py, 0), ry = c.g.rotation.y;
  const pos = tg.clone().addScaledVector(V(Math.sin(ry), 0, Math.cos(ry)), dist).addScaledVector(V(Math.cos(ry), 0, -Math.sin(ry)), side);
  pos.y += up;
  return [...pos.toArray(), ...tg.toArray()];
}
function cameraKeys() {
  const mid = ci => { const ws = cards[ci].words; return (ws[0].top + ws[ws.length - 1].bottom) / 2; };
  const cx = ci => cards[ci].w / 2, cy = ci => cards[ci].h / 2;
  return [
    [0.0, 3.4, 2.4, 11.8, 0, 1.9, 4.4],
    [2.6, -2.6, 2.6, 12.2, 0, 2.0, 4.4],                 // travelling circulaire autour de Blip
    [3.9, 0, 4.6, 15.5, 0, 2.6, 0],                       // l'essaim s'éparpille : on recule et on monte
    [4.7, ...shot(0, cx(0), cy(0), 9.4, -2.6, .9)],        // Ride My Park : contour, remplissage, image
    [6.0, ...shot(0, cx(0), cy(0) * .95, 8.2, -1.4, .6)],
    [6.7, ...shot(0, cx(0), mid(0), 5.0, -.7, .25)],       // gros plan : l'I-beam tape le texte
    [9.0, ...shot(0, cx(0), mid(0), 4.6, .4, .15)],
    [9.9, ...shot(1, cx(1), cy(1), 9.6, -3.4, .9)],        // Skoolbook, de trois-quarts : Ride My Park derrière elle
    [11.0, ...shot(1, cx(1), cy(1), 8.4, -1.2, .5)],
    [11.7, ...shot(1, cx(1), mid(1), 5.3, -.5, .2)],
    [13.3, ...shot(1, cx(1), mid(1), 4.8, .4, .15)],
    [14.1, 5.25, 3.9, 12.6, 5.25, 2.7, .1],                // Teach Tools + GyroDex : deux chantiers côte à côte
    [15.4, 5.25, 2.7, 11.1, 5.25, 1.95, .1],               // on descend sur les deux textes qui s'écrivent
    [17.6, 5.25, 2.5, 10.4, 5.25, 1.85, .1],
    [18.8, 0, 6.0, 22.6, 0, 2.6, 0],                      // grue arrière : la galerie entière
    [21.5, 0, 4.9, 20.8, 0, 2.45, 0]
  ];
}
function camAt(T) {
  const [px, py, pz, tx, ty, tz] = track(T, CAMK);
  camera.position.set(px, py, pz);
  camera.lookAt(tx, ty, tz);
}

// ── acteurs ────────────────────────────────────────────────────────
const actors = {};
let lead, hero, ring, bits, cathode;
const BIT_COLORS = [PAL.accent, PAL.clay, PAL.ochre, PAL.ink, '#63a89b', '#289bd2'];
async function buildActors() {
  lead = await blipVoxels('blip-default', 2.2);          // le Blip héros (intro et final)
  scene.add(lead);
  cathode = await cathodeVoxels(1.05);
  scene.add(cathode);
  const crewA = [['pencil', 'pencil', PAL.ochre], ['bucket', 'bucket', PAL.clay], ['brush', 'brush', PAL.accent],
                 ['ibeam', 'ibeam', PAL.ink, '#f8f7f4'], ['point', 'hand-point', '#ffffff']];
  // à l'échelle du texte qu'ils écrivent (un I-beam ≈ deux lignes de paragraphe), pas des géants
  for (const [k, id, fill, ink] of crewA) { actors[k] = await cursorVoxels(id, fill, ink || '#111', .42); scene.add(actors[k]); }
  // équipe B : les Blip des autres thèmes, plus les curseurs qui ne font que suivre (la foule de l'essaim)
  for (const [k, name] of [['blue', 'blip-blueprint'], ['retro', 'blip-retro90s'], ['term', 'blip-terminal'], ['fps', 'blip-fps']]) {
    actors[k] = await blipVoxels(name, .5); scene.add(actors[k]);
  }
  for (const [k, id, fill] of [['x1', 'crosshair', '#ffffff'], ['x2', 'move', '#ffffff'], ['x3', 'zoom', '#ffffff'], ['x4', 'arrow-mac', '#ffffff'], ['x5', 'wait', '#ffffff'], ['x6', 'copy', '#ffffff']]) {
    actors[k] = await cursorVoxels(id, fill, '#111', .75); scene.add(actors[k]);
  }
  ring = new THREE.Mesh(new THREE.TorusGeometry(1, .03, 8, 96), new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true }));
  ring.rotation.x = -Math.PI / 2;
  scene.add(ring);
  bits = new THREE.InstancedMesh(boxGeo, new THREE.MeshStandardMaterial({ roughness: .5 }), 40);
  for (let i = 0; i < 40; i++) bits.setColorAt(i, new THREE.Color(BIT_COLORS[i % BIT_COLORS.length]));
  bits.castShadow = true;
  scene.add(bits);
}
const HOME = V(0, 0, 4.4);                               // Blip au sol, devant la galerie
const SPLIT = 2.7, FUSE = 18.9;
// position d'attente de chaque curseur autour d'une carte (px de la carte, z)
// (au repos : sur les bords, hors du texte ; seul celui qui travaille est sur la carte)
const PARK = { pencil: [-70, -50, .5], bucket: [580, 90, .6], brush: [580, 260, .5], ibeam: [-75, 330, .4], point: [560, 440, .6],
               blue: [580, -40, .6], fps: [580, 160, .6], retro: [580, 300, .6], term: [-85, 330, .5] };
const CREW_B_ROLE = { blue: 'pencil', fps: 'bucket', retro: 'brush', term: 'ibeam' };
const ROLE_PHASE = { pencil: 'frame', bucket: 'fill', brush: 'paint', point: 'badge', ibeam: 'text' };

function spiral(i, n, r) {                               // spirale d'or, comme l'essaim du site
  const a = i * 2.39996, rr = r * Math.sqrt((i + 1) / n);
  return V(Math.cos(a) * rr, 1.2 + Math.sin(a) * rr * .55, 3.2 + Math.sin(a * .7) * .6);
}
function placeActor(o, p, t, k) {
  o.visible = true;
  o.position.copy(p);
  // les curseurs regardent un peu la caméra, avec un léger roulis vivant (par pas)
  const ts = step(t);
  o.rotation.set(0, Math.sin(ts * 1.3 + k) * .25 - .15, Math.sin(ts * 2.1 + k * 2) * .06);
  o.position.y += Math.sin(ts * 5 + k) * .02;
}

// ── render(t) ──────────────────────────────────────────────────────
let STILL = false;
function render(T) {
  const t = step(T);
  camAt(STILL ? DURATION : T);
  const states = cards.map((c, i) => cardState(c, i, t, STILL));

  // Blip héros : seul en gros plan, clignote, se tasse, se divise ; revient à la fusion
  const showLead = STILL || t < SPLIT || t >= FUSE;
  lead.visible = showLead;
  if (showLead) {
    let y = 0, sy = 1, sc = (!STILL && t < SPLIT) ? 2.2 : 1.45;
    if (!STILL && t < SPLIT) {
      y = Math.floor(t * 1.25) % 2 ? .02 : 0;                        // respiration ±1 px
      if (t > SPLIT - .4) sy = .8;                                    // il prend son élan
      lead.blink(blinkAt(t));
    } else {
      const kk = STILL ? 1 : prog(t, FUSE, FUSE + .6);
      const hop = [[2.4, .3], [1.2, .8], [.25, 1.15], [0, .92], [.05, 1.02], [0, 1]][Math.min(5, Math.floor(kk * 6))];
      y = hop[0]; sy = hop[1];
      lead.blink(!STILL && blinkAt(t, .4) && t > FUSE + .8);
    }
    lead.position.set(HOME.x - 6 * VOX * sc, 0, HOME.z);   // la pointe est l'origine : on centre le corps (colonne 12)
    lead.scale.set(sc, sc * sy, sc);
    lead.position.y = HOME.y + 22 * VOX * sc * sy + y;
    lead.rotation.set(0, STILL ? .12 : Math.sin(step(t) * .8) * .2, 0);
  }

  // Cathode : elle regarde le chantier depuis le sol, saute de joie à chaque projet fini,
  // puis rejoint Blip pour la photo de fin (tout par pas de 1/12 s)
  {
    const show = STILL || t >= SPLIT + .5;
    cathode.visible = show;
    if (show) {
      // perchée sur la tranche de Skoolbook, comme sur le site où elle grimpe sur les cartes :
      // elle voit tout le chantier et ne passe jamais devant un texte qu'on filme ; saut final vers Blip
      const c1 = cards[1], perch = cardPoint(c1, c1.w * .72, 0, -.07);
      const keys = [[SPLIT + .5, perch.x, perch.y + .07, perch.z], [FUSE - .7, perch.x, perch.y + .07, perch.z], [FUSE + .1, 2.35, 0, 4.7]];
      const [x, y0, z] = STILL ? [2.35, 0, 4.7] : track(t, keys, k => Math.floor(k * 10) / 10);
      const arc = STILL ? 0 : Math.sin(Math.PI * Math.floor(prog(t, FUSE - .7, FUSE + .1) * 10) / 10) * 1.6;
      const doneAt = BUILD.map(([s0, D, , PH]) => s0 + PH.text[1] * D);
      const hopT = STILL ? -1 : Math.max(...doneAt.filter(d => t >= d && t < d + .5).map(d => t - d), -1);
      const hop = hopT >= 0 ? [[0, .82], [.45, 1.12], [.6, 1.05], [.2, 1], [0, .9], [0, 1]][Math.min(5, Math.floor(hopT / .5 * 6))] : [0, 1];
      const sc = 1.05;
      const drop = STILL ? 0 : 3 * (1 - out(Math.floor(prog(t, SPLIT + .5, SPLIT + .9) * 5) / 5));   // elle tombe de l'essaim
      cathode.position.set(x, y0 + hop[0] + arc + drop, z);               // origine = ses pieds (hot [11,22])
      cathode.scale.set(sc, sc * hop[1], sc);
      // elle tourne la tête vers la carte en construction, de face pour la photo de fin
      const focus = t < 9.4 ? 0 : t < 13.6 ? 1 : 2.5;
      const fx = lerp(LAYOUT[Math.floor(focus)][0], LAYOUT[Math.ceil(focus)][0], focus % 1);
      const look = STILL || t > FUSE ? -.25 : clamp(Math.atan2(fx - x, -3) * .5, -.7, .7);
      cathode.rotation.set(0, Math.round(look * 8) / 8, 0);
      cathode.blink(!STILL && blinkAt(t, .53));
    }
  }

  // anneau de choc + éclats (division et fusion)
  const burst = (t0, center, reach) => {
    const k = prog(t, t0, t0 + .7);
    const on = k > 0 && k < 1;
    ring.visible = on && !STILL;
    if (on) { ring.position.copy(center).setY(.02); ring.scale.setScalar(.4 + reach * out(k)); ring.material.opacity = 1 - k; }
    const m = new THREE.Matrix4();
    for (let i = 0; i < 40; i++) {
      const a = i * 2.39996, r = reach * .8 * out(k), up = Math.sin(k * Math.PI) * (1.5 + (i % 5) * .3);
      const s = on ? .09 : 0;
      m.makeScale(s, s, s).setPosition(center.x + Math.cos(a) * r, center.y + up, center.z + Math.sin(a) * r * .6);
      bits.setMatrixAt(i, m);
    }
    bits.instanceMatrix.needsUpdate = true;
    return on;
  };
  if (!burst(SPLIT, V(0, .8, 3.2), 3.2)) burst(FUSE, V(0, .6, 3.2), 2.6);

  // l'essaim
  const live = !STILL && t >= SPLIT && t < FUSE;
  const names = Object.keys(actors);
  let dirty = false;
  names.forEach((k, i) => {
    const o = actors[k];
    if (!live) { o.visible = false; return; }
    let p;
    const extra = k.startsWith('x');
    const crewB = CREW_B_ROLE[k];
    if (extra) {
      // la foule : orbite autour du chantier en cours, comme des badauds
      const focus = t < 8.2 ? 0 : t < 11 ? 1 : 2.5;
      const cx = lerp(LAYOUT[Math.floor(focus)][0], LAYOUT[Math.ceil(focus)][0], focus % 1);
      // une nuée au-dessus du chantier, derrière les cartes : jamais entre la caméra et le travail
      const a = step(t) * .5 + i * 1.05;
      p = V(cx + Math.cos(a) * 3.0, 11 + Math.sin(a * 1.7) * .5, -3 + Math.sin(a) * .8);   // ils s'envolent hors champ : un seul outil travaille à la fois
    } else {
      const role = crewB || k;
      const list = crewB ? [3] : [0, 1, 2];
      const ph = ROLE_PHASE[role];
      // au repos : d'une carte à la suivante
      const keys = [];
      list.forEach(ci => {
        // Teach Tools a GyroDex à sa droite : l'équipe A y attend à gauche, pour ne pas gêner l'équipe B
        const pk = PARK[k], px = !crewB && ci === 2 && pk[0] > cards[ci].w ? cards[ci].w - pk[0] : pk[0];
        const pp = cardPoint(cards[ci], px, pk[1], pk[2]);
        const [, b] = states[ci].at(ph);
        let t0 = ci === list[0] ? SPLIT + .9 : BUILD[ci][0] - .6;
        if (keys.length && t0 <= keys[keys.length - 1][0]) t0 = keys[keys.length - 1][0] + .05;
        keys.push([t0, pp.x, pp.y, pp.z], [Math.max(t0 + .05, b + .5), pp.x, pp.y, pp.z]);
      });
      const last = keys[keys.length - 1];
      keys.push([FUSE - 1.2, last[1], last[2], last[3]], [FUSE, 0, 1.4, 3.2]);
      p = V(...track(t, keys));
      // au travail : il quitte sa place, fait son geste, y retourne
      for (const ci of list) {
        const [a, b] = states[ci].at(ph);
        if (!states[ci][role]) continue;
        if (t >= a - .45 && t < a) p = p.clone().lerp(cardState(cards[ci], ci, a, false)[role], out(prog(t, a - .45, a - .05)));
        else if (t >= a && t < b) p = states[ci][role];
        else if (t >= b && t < b + .45) p = cardState(cards[ci], ci, b, false)[role].lerp(p, out(prog(t, b + .05, b + .45)));
      }
      dirty = true;
    }
    // éclatement depuis Blip : sauts en spirale
    const k0 = prog(t, SPLIT, SPLIT + .9);
    if (k0 < 1) {
      const e = out(Math.floor(k0 * 8) / 8);
      const sp = spiral(i, names.length, 2.6);
      const from = V(0, 1.1, 3.2);
      const mid = from.clone().lerp(sp, Math.min(1, e * 1.6));
      p = mid.lerp(p, clamp((e - .45) / .55));
    }
    // fusion : tout le monde converge en spirale vers Blip
    const kf = prog(t, FUSE - .9, FUSE);
    if (kf > 0) {
      const a = kf * 6 + i, r = (1 - kf) * 2.2;
      p = p.clone().lerp(V(Math.cos(a) * r, 1.3 + (1 - kf) * .8, 3.2 + Math.sin(a) * r * .5), ease(kf));
    }
    placeActor(o, p, t, i);
    if (o.blink) o.blink(blinkAt(t, i * .37));
  });
  if (dirty) cards.forEach((c, i) => cardState(c, i, t, STILL));   // les poses « à l'instant a/b » ont touché aux cartes
  renderer.render(scene, camera);
}
const blinkAt = (t, phase = 0) => ((t + phase) % 1.06) < 1 / 12;

// ── montage ────────────────────────────────────────────────────────
window.ready = (async () => {
  const font = new FontFace('JetBrains Mono', 'url(/frontend/assets/fonts/tDbV2o-flEEny0FZhsfKu5WU4xD7OwE.woff2)', { weight: '400' });
  document.fonts.add(await font.load());
  const meta = await (await fetch(`${CAP}/meta.json`)).json();
  await buildCards(meta);
  cards.forEach((c, i) => {
    const [x, y, z, ry] = LAYOUT[i];
    c.g.position.set(x, y, z);
    c.g.rotation.y = ry;
    c.g.updateMatrixWorld(true);
  });
  CAMK = cameraKeys();
  await buildActors();
  window.DURATION = DURATION;
  window.render = render;
  window.setStill = v => { STILL = v; };
  render(Q.has('t') ? +Q.get('t') : 16.5);
})();
</script>
</body>
</html>
