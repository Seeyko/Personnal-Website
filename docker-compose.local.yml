version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Bind mount for local development (overrides COPY'd articles for hot-reload)
      - ./blog/articles:/app/articles:ro
      # Persistent data volume for SQLite
      - blog-data-local:/app/data
    environment:
      - PORT=3000
      - ARTICLES_DIR=/app/articles
      - FRONTEND_URL=http://localhost:8000
      - DB_PATH=/app/data/blog.db
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key-change-me}
      - ADMIN_SECRET_PATH=${ADMIN_SECRET_PATH:-_mx9k7}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}

volumes:
  blog-data-local:
