<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blip Cursor QA harness</title>
<link rel="stylesheet" href="/css/blip-cursor.css">
<style>
  html,body{margin:0;height:100%;font-family:sans-serif}
  body[data-theme="terminal"]{background:#0a0a0a;color:#33ff00}
  body[data-theme="blueprint"]{background:#003366;color:#fff}
  body[data-theme="retro90s"]{background:#c0c0c0;color:#000}
  body[data-theme="default"]{background:#f8f7f4;color:#1a3a35}
  .stage{padding:40px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
  a,button{font-size:18px;padding:8px 14px}
  input,textarea{font-size:16px;padding:6px;display:block;margin-top:4px}
  /* fake theme "custom cursor" element, mimicking real site behavior */
  .custom-cursor{position:fixed;top:10px;right:10px;width:40px;height:40px;background:red;opacity:1;z-index:9999}
  #status{position:fixed;top:0;left:0;background:#000;color:#0f0;font:12px monospace;padding:4px 8px;z-index:999999}
</style>
</head>
<body data-theme="terminal" class="loading">
<div id="status">loading...</div>
<div id="custom-cursor" class="custom-cursor"></div>
<div class="stage">
  <h1>Blip cursor QA</h1>
  <p>Move mouse, click, hover the link/button, focus the input, resize below 900px.</p>
  <a href="#" id="test-link">A link to hover</a>
  <button id="test-btn">A button</button>
  <span class="clickable" id="test-clickable" style="cursor:pointer;border:1px dashed;padding:6px;">.clickable span</span>
  <input type="text" placeholder="text input (native cursor expected)">
  <select><option>select (native arrow expected)</option></select>
  <div contenteditable="true" style="border:1px solid;padding:8px;min-width:200px;">contenteditable div</div>
</div>
<script src="/js/core/effects/blip-cursor.js"></script>
<script>
  BlipCursor.init();
  document.getElementById('status').textContent =
    'active=' + BlipCursor.isActive + ' running=' + BlipCursor.isRunning +
    ' blipEl=' + !!document.getElementById('blip-cursor') +
    ' htmlActive=' + document.documentElement.classList.contains('bc-active');

  /* --- QA freeze hook, mirrors the kit's own harness:
     ?state=bc-xxx&t=MS&theme=name freezes the state at t ms --- */
  (function () {
    var q = location.search;
    var s = q.match(/[?&]state=([a-z0-9-]+)/);
    var m = q.match(/[?&]t=(\d+)/);
    var th = q.match(/[?&]theme=([a-z0-9]+)/);
    var mv = q.match(/[?&]move=(\d+),(\d+)/);
    if (th) document.body.dataset.theme = th[1];
    if (mv) {
      var evt = new MouseEvent('pointermove', { clientX: +mv[1], clientY: +mv[2], bubbles: true });
      document.dispatchEvent(evt);
    }
    function freeze() {
      var el = document.getElementById('blip-cursor');
      if (s && el) el.classList.add(s[1]);
      if (!m) return;
      var t = +m[1];
      function scrub() {
        document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t; });
      }
      requestAnimationFrame(function () { requestAnimationFrame(scrub); });
    }
    // give BlipCursor a tick to create the DOM before we try to freeze it
    setTimeout(freeze, 50);
  })();
</script>
</body>
</html>
