  <!-- Critical CSS -->
  <style id="critical-css">
    body.loading #main-content,
    body.loading .theme-overlay,
    body.loading .theme-switcher {
      opacity: 0 !important;
      visibility: hidden !important;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f8f7f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(61, 122, 115, 0.15);
      border-top-color: #3d7a73;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 1.25rem;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 0.8125rem;
      color: #8a8279;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body:not(.loading) #main-content,
    body:not(.loading) .theme-overlay,
    body:not(.loading) .theme-switcher {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
